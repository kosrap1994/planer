<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Planner Game</title>
    <meta name="theme-color" content="#0b0e14">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Планер">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="layout">
    <aside class="sidebar">
        <nav class="side-nav" id="side-nav">
            <button class="nav-item active" data-view="view-today"><span class="nav-ico" data-ico="sun"></span><span class="nav-label">Сегодня</span></button>
            <button class="nav-item" data-view="view-week"><span class="nav-ico" data-ico="calendar"></span><span class="nav-label">Неделя</span></button>
            <button class="nav-item" data-view="view-goals"><span class="nav-ico" data-ico="target"></span><span class="nav-label">Цели</span></button>
            <button class="nav-item" data-view="view-character"><span class="nav-ico" data-ico="helmet"></span><span class="nav-label">Персонаж</span></button>
            <button class="nav-item" data-view="view-shop"><span class="nav-ico" data-ico="bag"></span><span class="nav-label">Магазин</span></button>
            <button class="nav-item" data-view="view-top"><span class="nav-ico" data-ico="trophy"></span><span class="nav-label">Топ</span></button>
        </nav>
        <button class="side-char" id="side-char" data-view="view-character" title="Открыть персонажа">
            <canvas id="side-char-canvas" width="66" height="87" class="px"></canvas>
            <div class="side-char-info">
                <span class="side-char-lvl" id="side-char-lvl">LVL 1</span>
                <span class="side-char-tier" id="side-char-tier"></span>
            </div>
        </button>
    </aside>

    <div class="main">
        <header class="hud">
            <div class="hud-level" id="hud-level">LVL 1</div>
            <div class="hud-exp">
                <div class="hud-exp-numbers"><span id="hud-exp-text">0 / 100</span></div>
                <div class="bar bar-exp"><div class="bar-fill" id="hud-exp-fill"></div></div>
            </div>
            <div class="hud-right">
                <div class="hud-chip hud-coins" id="hud-coins" title="Монеты"></div>
            </div>
        </header>

        <main class="content">
            <section id="view-today" class="view active"></section>
            <section id="view-week" class="view"></section>
            <section id="view-goals" class="view"></section>
            <section id="view-top" class="view"></section>
            <section id="view-character" class="view"></section>
            <section id="view-shop" class="view"></section>
        </main>
    </div>
</div>

<div id="float-container"></div>
<div id="toast-container"></div>
<div id="modal-root"></div>

<script type="module" src="./js/app.js"></script>
<script>
// PWA: офлайн-режим и установка на телефон
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
}
</script>
</body>
</html>
